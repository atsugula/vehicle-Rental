<div class="min-h-screen bg-[#EFF4FF]">
  <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/80 backdrop-blur">
    <div class="flex h-16 items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
      <div class="flex items-center gap-2.5">
        <span
          class="flex h-9 w-9 items-center justify-center rounded-lg bg-[#FF6B1A] text-sm font-black text-[#0F1F3D]"
          >V</span
        >
        <span class="hidden text-lg font-semibold tracking-tight text-slate-900 sm:block"
          >Velo<span class="text-[#E5570A]">rent</span></span
        >
      </div>

      <!-- Navegación a módulos (rutas hijas de Layout en app.routes.ts) -->
      <nav
        class="hidden flex-1 items-center justify-center gap-1 md:flex"
        aria-label="Navegación principal"
      >
        <a
          class="flex items-center gap-2 rounded-lg bg-[#DCE6FF]/60 px-3 py-2 text-sm font-semibold text-[#1B3568] transition"
          routerLink="/dashboard"
          aria-current="page"
        >
          <svg
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.25 12 11.204 3.045c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75"
            />
          </svg>
          Dashboard
        </a>
        <a
          class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-[#EFF4FF] hover:text-[#24468A]"
          routerLink="/vehicles"
        >
          <svg
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M8.25 18.75a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 0 1-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h1.125c.621 0 1.125-.504 1.125-1.125V14.25m-17.25 4.5V15c0-.621.504-1.125 1.125-1.125h1.5m-1.5 0h9.75M15.75 5.25v5.25m0 0h3.75m-3.75 0h-2.25m5.25 0h1.125c.621 0 1.129.504 1.09 1.124a2.999 2.999 0 0 1-2.09.876h-.13m-2.245-2.5H15.75m0 0V5.25m0 5.25v5.25m0 0h-9.75M15.75 15h-9.75m9.75 0V6.375m0 8.625H4.5"
            />
          </svg>
          Vehículos
        </a>
        <a
          class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-[#EFF4FF] hover:text-[#24468A]"
          routerLink="/bookings"
        >
          <svg
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"
            />
          </svg>
          Reservas
        </a>
        <a
          class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-[#EFF4FF] hover:text-[#24468A]"
          routerLink="/customers"
        >
          <svg
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"
            />
          </svg>
          Clientes
        </a>
      </nav>

      <!-- Placeholder: usuario autenticado (reemplazar con datos reales de sesión) -->
      <div class="flex items-center gap-3 sm:gap-4">
        <div class="hidden items-center gap-3 sm:flex">
          <div class="text-right leading-tight">
            <p class="text-sm font-semibold text-slate-800">{{ currentUser }}</p>
            <!-- <p class="text-xs text-slate-500">Administrador</p> -->
          </div>
          <span
            class="flex h-9 w-9 items-center justify-center rounded-full bg-[#DCE6FF] text-sm font-semibold text-[#24468A]"
            >{{ currentUser?.charAt(0) }}</span
          >
        </div>

        <span class="hidden h-8 w-px bg-slate-200 sm:block"></span>

        <!-- Placeholder: botón de cerrar sesión -->
        <button
          class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-red-50 hover:text-[#DC2626]"
          type="button"
          (click)="onLogout()"
        >
          <svg
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M18 12H9m9 0-3-3m3 3-3 3"
            />
          </svg>
          <span class="hidden sm:inline">Cerrar sesión</span>
        </button>
      </div>
    </div>

    <!-- Navegación a módulos, versión compacta para móvil (< md) -->
    <nav
      class="flex items-center gap-1 overflow-x-auto border-t border-slate-200 px-4 py-2 md:hidden"
      aria-label="Navegación principal"
    >
      <a
        class="flex shrink-0 items-center gap-1.5 rounded-lg bg-[#DCE6FF]/60 px-3 py-1.5 text-xs font-semibold text-[#1B3568]"
        href="/dashboard"
        aria-current="page"
        >Dashboard</a
      >
      <a
        class="flex shrink-0 items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-medium text-slate-600"
        href="/vehicles"
        >Vehículos</a
      >
      <a
        class="flex shrink-0 items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-medium text-slate-600"
        href="/bookings"
        >Reservas</a
      >
      <a
        class="flex shrink-0 items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-medium text-slate-600"
        href="/customers"
        >Clientes</a
      >
    </nav>
  </header>

  <main class="px-4 py-8 sm:px-6 lg:px-8">
    <router-outlet></router-outlet>
  </main>
</div>
